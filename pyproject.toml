[project]
name = "c2c-rulesync"
version = "0.1.0"
description = "Codex CLI hook that loads Claude Code .claude/rules under the conditions Claude Code loads them"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Hayes" }]
keywords = ["codex", "claude-code", "hooks", "rules"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = []

[project.urls]
Repository = "https://github.com/92khsang/c2c-rulesync"

[project.scripts]
c2c-rulesync = "c2c_rulesync.cli:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7,<0.17",
]

[tool.pytest]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
